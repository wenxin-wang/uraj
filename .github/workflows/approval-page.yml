# Publish the sudo-tiers approval page to GitHub Pages, only from main
# (only humans merge into main).  See docs/projects/261116-sudo-tiers/.
name: approval-page
on:
  push:
    branches: [main]
    paths: [exp/sudo-tiers-approval_20261116/page/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: exp/sudo-tiers-approval_20261116/page
      - id: deployment
        uses: actions/deploy-pages@v4

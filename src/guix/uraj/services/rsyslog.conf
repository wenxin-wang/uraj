# Local syslog and kernel messages; no network listeners.
module(load="imuxsock")
module(load="imklog")
module(load="builtin:omfile" fileOwner="root" fileGroup="root" fileCreateMode="0640")

# Per-service files from (uraj services logs); they stop what they match.
# Read at startup only: restart syslogd after a reconfigure adds one.
include(file="/etc/rsyslog.d/*.conf" mode="optional")

# Keep all severities, but keep authentication and mail out of the readable log.
*.*;auth.none;authpriv.none;mail.none action(type="omfile" file="/var/log/messages" fileGroup="log-readers")
auth,authpriv.* action(type="omfile" file="/var/log/secure" sync="on")
mail.* action(type="omfile" file="/var/log/maillog")
*.=debug action(type="omfile" file="/var/log/debug")

# Retain the console destinations of Shepherd's built-in logger.
*.*;auth.none;authpriv.none;mail.none -/dev/tty12
*.alert -/dev/console

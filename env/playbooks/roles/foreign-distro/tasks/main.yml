---
- name: Install the host password service and login integration
  ansible.builtin.apt:
    name:
      - gnome-keyring
      - libpam-gnome-keyring
    state: present
    update_cache: true
    cache_valid_time: 86400
  when: ansible_facts['os_family'] == 'Debian'
  tags: [keyring]

- name: Install pcscd (smart card daemon)
  ansible.builtin.apt:
    name: pcscd
    state: present
    update_cache: true
    cache_valid_time: 86400
  when: ansible_facts['os_family'] == 'Debian'
  tags: [pcscd]

- name: Check for the evince AppArmor profile
  ansible.builtin.stat:
    path: /etc/apparmor.d/usr.bin.evince
  register: evince_apparmor_profile
  tags: [apparmor]

- name: Let evince read the Guix store
  ansible.builtin.copy:
    content: |
      # Guix Home puts XDG_DATA_DIRS/FONTCONFIG_PATH in ~/.guix-home and
      # /gnu/store, which the shipped evince profile denies (only
      # @{HOME}/[^.]** is allowed); GTK then aborts loading the
      # image-missing icon.
      /gnu/store/** r,
    dest: /etc/apparmor.d/local/usr.bin.evince
    owner: root
    group: root
    mode: "0644"
  when: evince_apparmor_profile.stat.exists
  notify: Reload the evince AppArmor profile
  tags: [apparmor]

- name: Install the niri Wayland session desktop entry
  ansible.builtin.copy:
    src: niri.desktop
    dest: /usr/share/wayland-sessions/niri.desktop
    owner: root
    group: root
    mode: "0644"
  tags: [session]

- name: Install the niri session wrapper for GDM
  ansible.builtin.copy:
    src: niri-session
    dest: /usr/local/bin/niri-session
    owner: root
    group: root
    mode: "0755"
  tags: [session]

- name: Check for a GDM configuration
  ansible.builtin.stat:
    path: /etc/gdm3/custom.conf
  register: gdm_custom_conf
  tags: [gdm]

- name: Leave GDM's Wayland setting at the default
  ansible.builtin.lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: '^\s*#?\s*WaylandEnable\s*='
    line: "# WaylandEnable=false"
    insertafter: '^\[daemon\]'
  when: gdm_custom_conf.stat.exists
  notify: Restart gdm3
  tags: [gdm]

# Make the user's pulled Guix the lock's, as base-services does for the
# system guix on Guix System, so plain `guix' behaves like `guix
# time-machine -C env/guix/channels-lock.scm --'.  Pulls only when
# `guix describe' differs from the lock, which it prints verbatim.
- name: Pin the user's Guix to the channel lock
  become: false
  vars:
    guix_channels_lock: "{{ playbook_dir }}/../guix/channels-lock.scm"
    guix_current: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/guix/current"
  tags: [guix]
  block:
    - name: Describe the pulled Guix
      ansible.builtin.command:
        argv: ["{{ guix_current }}/bin/guix", describe, --format=channels]
      register: guix_described
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Pull the locked channels
      ansible.builtin.command:
        # The lock may move back (a revert, an older checkout); pull
        # refuses that without --allow-downgrades.
        argv:
          - guix
          - pull
          - "--channels={{ guix_channels_lock }}"
          - --allow-downgrades
      when: >-
        guix_described.rc != 0 or
        guix_described.stdout != lookup('ansible.builtin.file',
                                        guix_channels_lock)

# Cache both OpenPGP passphrases/card PINs and SSH keys for one hour.
default-cache-ttl 3600
default-cache-ttl-ssh 3600

# Expose authentication-capable keys, including the authentication key on an
# inserted OpenPGP card, through gpg-agent's SSH socket.
enable-ssh-support

# Prefer a graphical pinentry in a graphical session, with a terminal fallback
# for consoles and remote sessions.
pinentry-program ~/.local/bin/pinentry-auto

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
Ubuntu 的 64-language-selector-cjk-prefer.conf 把 Noto CJK 的 JP 变体排在
prefer 列表最前，而 Noto CJK 的 JP/KR/SC/TC/HK 变体在同一个 ttc 里、lang
列表完全相同（都含 zh-cn），所以 LANG=en_US.UTF-8 时不带 zh-cn 的查询
（ghostty、GTK 等）给汉字找 fallback 会一律选中 JP 变体。
69-language-selector-zh-cn.conf 本来是正确的，但只在 LANG=zh_CN 时生效。

这里把 SC 变体插到 generic family 列表最前面，同时保留各 family 原有的首选
（拉丁字符渲染不变）；weak 绑定保证程序自己显式指定的字体仍然最优先。
本文件由 50-user.conf 加载，故早于 64/69，但不与之冲突。
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>DejaVu Sans Mono</string>
      <string>Sarasa Mono SC</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
</fontconfig>

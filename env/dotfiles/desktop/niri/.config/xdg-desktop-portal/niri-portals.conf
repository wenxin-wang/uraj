# Same as niri's shipped niri-portals.conf (found later in the search
# path, in the profile's share/xdg-desktop-portal), plus an explicit
# FileChooser override: the GNOME backend's file chooser is a thin
# D-Bus proxy to org.gnome.Nautilus, which the host's Nautilus does not
# implement (no /org/freedesktop/portal/desktop object), so every
# open/save request routed there fails with "Delegated FileChooser call
# failed" (response 2) and the requesting application just gets an
# error.  The GTK backend implements FileChooser itself and is used
# instead.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;

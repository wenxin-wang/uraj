<!doctype html>
<!-- Approval page for sudo-tiers.  Requests travel in the URL fragment, which
     the browser never sends to the server.  The page shows the request,
     signs SHA-256 of its exact bytes with a passkey, and posts the assertion
     to the ntfy topic named inside the (signed) request. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审批</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1em; max-width: 50em; }
  pre { background: #f4f4f4; padding: .6em; white-space: pre-wrap;
        word-break: break-all; }
  button { font-size: 1.2em; padding: .5em 1.2em; margin: .3em .3em 0 0; }
  .bad { color: #b00; }
  .ok { color: #070; }
  th { text-align: left; padding-right: 1em; vertical-align: top; }
</style>
</head>
<body>
<div id="app">加载中…</div>
<script>
"use strict";

const app = document.getElementById("app");

function b64url(bytes) {
  let s = "";
  for (const b of new Uint8Array(bytes)) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function unb64url(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "===".slice((s.length + 3) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

async function inflate(bytes) {
  const stream = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, attrs || {});
  for (const c of children) e.append(c);
  return e;
}

function status(text, cls) {
  app.append(el("p", {className: cls || ""}, text));
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST", body: JSON.stringify(body)});
  if (!r.ok) throw new Error(`ntfy ${r.status}`);
}

// #register=<ntfy reply URL>: create a passkey and send its public key.
async function register(reply) {
  app.replaceChildren(
    el("h2", {}, "登记 passkey"),
    el("p", {}, `rpId：${location.hostname}`),
    el("p", {}, `公钥会发到：${reply}`));
  const button = el("button", {}, "创建 passkey");
  app.append(button);
  button.onclick = async () => {
    button.disabled = true;
    try {
      const cred = await navigator.credentials.create({publicKey: {
        rp: {id: location.hostname, name: "sudo-tiers"},
        user: {id: crypto.getRandomValues(new Uint8Array(16)),
               name: "sudo-tiers", displayName: "sudo-tiers"},
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        pubKeyCredParams: [{type: "public-key", alg: -7}],
        authenticatorSelection: {residentKey: "required",
                                 userVerification: "required"},
      }});
      const spki = cred.response.getPublicKey();
      const fp = b64url(await crypto.subtle.digest("SHA-256", spki))
        .slice(0, 16);
      await post(reply, {type: "register", credentialId: b64url(cred.rawId),
                         publicKey: b64url(spki)});
      status(`已发送。公钥指纹：${fp}`, "ok");
      status("在主机终端核对这个指纹后再确认。");
    } catch (e) {
      status(`失败：${e}`, "bad");
      button.disabled = false;
    }
  };
}

// #r=<base64url(deflate-raw(request JSON))>: show, then sign or reject.
async function approve(packed) {
  const raw = await inflate(unb64url(packed));
  const req = JSON.parse(new TextDecoder().decode(raw));
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", raw));
  const expired = Date.now() / 1000 > req.expires;

  const rows = el("table");
  const row = (k, v) => rows.append(el("tr", {}, el("th", {}, k),
                                       el("td", {}, String(v))));
  row("主机", req.host);
  row("用户", req.user);
  row("目录", req.cwd);
  row("有效期至", new Date(req.expires * 1000).toLocaleString());
  row("请求 id", req.id);
  row("hash", b64url(digest).slice(0, 16));
  app.replaceChildren(el("h2", {}, req.title || "审批请求"), rows);
  if (req.argv) app.append(el("h3", {}, "命令"),
                           el("pre", {}, JSON.stringify(req.argv)));
  if (req.script) app.append(el("h3", {}, "脚本"), el("pre", {}, req.script));
  if (req.note) app.append(el("h3", {}, "请求方自述（未核实）"),
                           el("pre", {}, req.note));
  if (expired) {
    status("已过期，不能批准。", "bad");
    return;
  }

  const yes = el("button", {}, "批准");
  const no = el("button", {}, "拒绝");
  app.append(el("div", {}, yes, no));
  const done = () => { yes.disabled = no.disabled = true; };

  yes.onclick = async () => {
    done();
    try {
      const cred = await navigator.credentials.get({publicKey: {
        challenge: digest,
        rpId: location.hostname,
        userVerification: "required",
      }});
      const r = cred.response;
      await post(req.reply, {
        type: "approve", id: req.id, credentialId: b64url(cred.rawId),
        authenticatorData: b64url(r.authenticatorData),
        clientDataJSON: b64url(r.clientDataJSON),
        signature: b64url(r.signature)});
      status("已批准。", "ok");
    } catch (e) {
      status(`失败：${e}`, "bad");
      yes.disabled = no.disabled = false;
    }
  };
  no.onclick = async () => {
    done();
    try {
      await post(req.reply, {type: "reject", id: req.id});
      status("已拒绝。", "ok");
    } catch (e) {
      status(`失败：${e}`, "bad");
      yes.disabled = no.disabled = false;
    }
  };
}

async function main() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.has("register")) return register(params.get("register"));
  if (params.has("r")) return approve(params.get("r"));
  app.textContent = "没有请求。";
}

main().catch(e => { app.replaceChildren(); status(`出错：${e}`, "bad"); });
</script>
</body>
</html>

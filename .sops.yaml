# Every file includes all administrator encryption subkeys.  The trailing !
# forces GnuPG to use that exact subkey rather than selecting a newer one.
keys:
  - &admin >-
      26A5DFBA3B06CF2A99D33CAC103496B20BF0307F!,
      87503C3C845B0F82DBA771F3ED48AC445C42128D!,
      7F26222A047E9F5EDFA496D00273036A1927C05B!

creation_rules:
  # Add each host's age recipient to its own rule when it is provisioned.
  - path_regex: ^secrets/hosts/lappie/[^/]+\.yaml$
    pgp: *admin
  - path_regex: ^secrets/hosts/storie/[^/]+\.yaml$
    pgp: *admin
  # Before sharing with hosts, add a specific rule ABOVE this fallback,
  # with only the age recipients of the participating hosts.
  - path_regex: ^secrets/shared/[^/]+\.yaml$
    pgp: *admin
